# Same configuration as go2_unilab_strict_32worker_34k_robotlab_scene_compat,
# with only the complete scene XML switched to Unitree's terrain scene.
policy_path: "{ROOT_DIR}/deploy/pre_train/go2/go2_unilab_strict_32worker_34k.pt"
xml_path: "{ROOT_DIR}/../unitree_mujoco/unitree_robots/go2/scene_terrain.xml"

render_fps: 300
video_fps: 60
save_video: false
simulation_duration: 60000000.0
simulation_dt: 0.002
control_decimation: 10

base_init_pos: [0.0, 0.0, 0.57]
base_init_quat: [1.0, 0.0, 0.0, 0.0]
self_collisions: asset
use_model_torque_limits: false

actuator_delay_min: 0
